<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruiter Live Feed Monitor - Admin Portal (API)</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #050811;
            --bg-secondary: #0c1222;
            --bg-tertiary: #161f36;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-primary: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.15);
            --danger: #ef4444;
            --success: #10b981;
            --border-color: rgba(255, 255, 255, 0.06);
            --font-sans: 'Plus Jakarta Sans', sans-serif;
            --font-display: 'Space Grotesk', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            margin: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            background-image: 
                radial-gradient(at 0% 100%, rgba(139, 92, 246, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(59, 130, 246, 0.08) 0px, transparent 50%);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            max-width: 650px;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 2.1rem;
            font-weight: 700;
            background: linear-gradient(135deg, #a78bfa 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 0 8px 0;
            letter-spacing: -0.02em;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin: 0;
            line-height: 1.5;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 25px;
            max-width: 1100px;
            width: 100%;
        }

        @media (max-width: 950px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .monitor-window {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            background-color: #020308;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.95);
            margin-top: 10px;
        }

        .monitor-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .placeholder-text {
            color: #475569;
            font-size: 0.95rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            text-align: center;
            padding: 20px;
        }

        .status-pill {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .status-offline {
            background-color: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .status-online {
            background-color: rgba(16, 185, 129, 0.15);
            color: #6ee7b7;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .control-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px 14px;
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 0.85rem;
            box-sizing: border-box;
            outline: none;
        }

        button {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-family: var(--font-sans);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
            transition: all 0.2s ease;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.5);
        }

        button.stop {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
        }

        .console-container {
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            font-family: var(--font-mono);
            font-size: 0.78rem;
            min-height: 180px;
            max-height: 220px;
            overflow-y: auto;
            margin-top: 15px;
        }

        .log-entry {
            margin-bottom: 6px;
            line-height: 1.4;
        }
        .log-info { color: #94a3b8; }
        .log-success { color: #34d399; }
        .log-error { color: #f87171; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Recruiter Live Feed Monitor</h1>
        <p class="subtitle">Real-time candidate proctoring activity and violation monitoring via REST API.</p>
    </div>

    <div class="dashboard">
        <!-- Main Panel -->
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <span style="font-weight: 600; font-size: 1.05rem;">Proctoring Live Monitor</span>
                <div id="statusBadge" class="status-pill status-offline">Offline</div>
            </div>

            <div class="monitor-window">
                <div id="placeholder" class="placeholder-text">
                    <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"></path>
                    </svg>
                    <span>Click "Start Monitoring" to fetch proctoring logs</span>
                </div>
                <img id="monitorView" class="monitor-img" src="" alt="Candidate Feed">
            </div>

            <!-- Console Log -->
            <div class="console-container" id="logEntries">
                <div class="log-entry log-info">[System] Ready to monitor proctoring events.</div>
            </div>
        </div>

        <!-- Sidebar Controls -->
        <div class="card">
            <div class="control-group">
                <label for="apiHost">Backend API Host</label>
                <input type="text" id="apiHost" value="http://127.0.0.1:5002">
            </div>

            <div class="control-group">
                <label for="appId">Application ID</label>
                <input type="number" id="appId" value="1">
            </div>

            <button id="connectBtn">Start Monitoring (API)</button>
        </div>
    </div>

    <script>
        const connectBtn = document.getElementById('connectBtn');
        const apiHostInput = document.getElementById('apiHost');
        const appIdInput = document.getElementById('appId');
        const statusBadge = document.getElementById('statusBadge');
        const logEntries = document.getElementById('logEntries');
        const monitorView = document.getElementById('monitorView');
        const placeholder = document.getElementById('placeholder');

        let pollTimer = null;

        function addLog(text, type = 'info') {
            const timeStr = new Date().toLocaleTimeString();
            const el = document.createElement('div');
            el.className = `log-entry log-${type}`;
            el.textContent = `[${timeStr}] ${text}`;
            logEntries.appendChild(el);
            logEntries.scrollTop = logEntries.scrollHeight;
        }

        async function pollProctoringData() {
            const host = apiHostInput.value.trim();
            const appId = parseInt(appIdInput.value.trim(), 10);

            try {
                const res = await fetch(`${host}/api/interview/fetch-interview-analysis`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ application_id: appId })
                });

                if (res.ok) {
                    const data = await res.json();
                    if (data && data.data) {
                        addLog(`Analysis checked: status=${data.data.status || 'in_progress'}`, 'success');
                    }
                }
            } catch (err) {
                addLog(`Poll error: ${err.message}`, 'error');
            }
        }

        connectBtn.addEventListener('click', () => {
            if (pollTimer) {
                clearInterval(pollTimer);
                pollTimer = null;
                statusBadge.textContent = "Offline";
                statusBadge.className = "status-pill status-offline";
                connectBtn.textContent = "Start Monitoring (API)";
                connectBtn.classList.remove('stop');
                addLog("Monitoring stopped.");
                return;
            }

            pollTimer = setInterval(pollProctoringData, 3000);
            pollProctoringData();

            statusBadge.textContent = "Monitoring";
            statusBadge.className = "status-pill status-online";
            connectBtn.textContent = "Stop Monitoring";
            connectBtn.classList.add('stop');
            addLog("Started API monitoring (polling every 3s)...", "success");
        });
    </script>
</body>
</html>
